name: Release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  stress:
    uses: ./.github/workflows/stress.yml

  package:
    needs: [verify, stress]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: fast-dump
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: fast-dump.exe
    defaults:
      run:
        shell: pwsh
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test release profile
        run: cargo test --locked --release --all-features --quiet
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }} --bin fast-dump
      - name: Package binary and build manifest
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_BINARY: ${{ matrix.binary }}
        run: |
          $packageDir = 'target/release-artifacts/package'
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          $binaryPath = "target/$env:RELEASE_TARGET/release/$env:RELEASE_BINARY"
          ./scripts/write-release-manifest.ps1 -Binary $binaryPath -Target $env:RELEASE_TARGET -OutputPath "$packageDir/manifest.json"
          Copy-Item -LiteralPath $binaryPath -Destination $packageDir
          Copy-Item -LiteralPath Cargo.lock -Destination $packageDir
          $archivePath = "target/release-artifacts/fast-dump-$env:RELEASE_TARGET.tar.gz"
          tar -czf $archivePath -C $packageDir $env:RELEASE_BINARY manifest.json Cargo.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archiveHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$archiveHash  $([System.IO.Path]::GetFileName($archivePath))" | Set-Content -LiteralPath "$archivePath.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: fast-dump-${{ matrix.target }}-${{ github.sha }}
          path: |
            target/release-artifacts/*.tar.gz
            target/release-artifacts/*.sha256
          if-no-files-found: error
