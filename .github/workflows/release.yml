name: Release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  stress:
    uses: ./.github/workflows/stress.yml

  package:
    needs: [verify, stress]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: fast-dump
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: fast-dump.exe
    defaults:
      run:
        shell: pwsh
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test release profile
        run: cargo test --locked --release --all-features --quiet
      - name: Build release binary
        id: build
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          $binaryPath = & ./scripts/build-release.ps1 -Target $env:RELEASE_TARGET
          & $binaryPath --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $binaryPath --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "binary_path=$binaryPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Package binary and build manifest
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_BINARY: ${{ matrix.binary }}
          RELEASE_BINARY_PATH: ${{ steps.build.outputs.binary_path }}
        run: |
          . ./scripts/release-common.ps1
          $buildContext = Get-ReleaseBuildContext -RepositoryRoot $PWD.Path
          $metadataJson = cargo metadata --locked --offline --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = ($metadataJson | ConvertFrom-Json).packages | Where-Object name -eq 'fast-dump'
          $revision = git rev-parse --short=7 HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releaseDir = "releases/$($package.version)-$revision"
          $packageDir = "$releaseDir/$env:RELEASE_TARGET"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          $binaryPath = $env:RELEASE_BINARY_PATH
          ./scripts/write-release-manifest.ps1 -Binary $binaryPath -Target $env:RELEASE_TARGET -OutputPath "$packageDir/manifest.json"
          Copy-Item -LiteralPath $binaryPath -Destination $packageDir
          Copy-Item -LiteralPath Cargo.lock -Destination $packageDir
          Assert-ReleaseFilePrivacy -Path @(
            "$packageDir/$env:RELEASE_BINARY",
            "$packageDir/manifest.json",
            "$packageDir/Cargo.lock"
          ) -PathMap $buildContext.PathMap
          $assetName = "fast-dump-$env:RELEASE_TARGET" + [IO.Path]::GetExtension($env:RELEASE_BINARY)
          $assetPath = Join-Path $releaseDir $assetName
          Copy-Item -LiteralPath "$packageDir/$env:RELEASE_BINARY" -Destination $assetPath
          $assetHash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$assetHash  $assetName" | Set-Content -LiteralPath "$assetPath.sha256" -Encoding ascii
          $archivePath = "$releaseDir/fast-dump-$revision-$env:RELEASE_TARGET.tar.gz"
          # ustar исключает PAX-метаданные, а владелец не зависит от учётной записи сборщика.
          $ownerOptions = if ($IsWindows) {
            @('--uid', '0', '--gid', '0', '--uname', 'root', '--gname', 'root')
          } else {
            @('--owner=0', '--group=0', '--numeric-owner')
          }
          tar --format=ustar @ownerOptions -czf $archivePath -C $packageDir $env:RELEASE_BINARY manifest.json Cargo.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archiveHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$archiveHash  $([System.IO.Path]::GetFileName($archivePath))" | Set-Content -LiteralPath "$archivePath.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: fast-dump-${{ matrix.target }}-${{ github.sha }}
          path: |
            releases/*/*.tar.gz
            releases/*/*.tar.gz.sha256
            releases/*/fast-dump-${{ matrix.target }}*
          if-no-files-found: error
