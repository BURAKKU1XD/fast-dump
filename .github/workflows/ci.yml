name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  verify:
    name: ${{ matrix.os }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        toolchain: [stable, "1.89.0"]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test default features
        run: python scripts/results.py record --kind test --label default -- cargo test --locked --quiet
      - name: Test all features
        run: python scripts/results.py record --kind test --label all-features -- cargo test --locked --all-features --quiet
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Check benches
        run: cargo check --locked --benches --all-features
      - name: Python regression tests
        run: python -B -m unittest discover -s scripts -p 'test_*.py'
      - name: PowerShell syntax
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $parseErrors = $null
            $parseTokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$parseTokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Shell syntax
        if: runner.os == 'Linux'
        shell: bash
        run: bash -n scripts/bench-netem.sh
      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}-${{ matrix.toolchain }}
          path: |
            results/tests/
            results/local/tests/
