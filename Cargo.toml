[package]
name = "fast-dump"
version = "0.2.2"
edition = "2024"
rust-version = "1.89"
description = "Fast, resumable directory transfers producing tar.zst archives"
readme = "README.md"

[features]
bench-internals = ["windows-sys/Win32_System_ProcessStatus", "windows-sys/Win32_System_Threading", "windows-sys/Win32_System_WindowsProgramming"]
bench-allocations = ["bench-internals"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
crossterm = "=0.29.0"
ctrlc = "=3.5.2"
env_logger = "0.11"
libc = "0.2"
log = "0.4"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
socket2 = "0.5"
subtle = "2"
tar = "0.4"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
twox-hash = { version = "2.1", default-features = false, features = ["std", "xxhash3_64"] }
webpki-roots = "1"
zstd = { version = "0.13", features = ["zstdmt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_IO", "Win32_System_WindowsProgramming", "Win32_Networking_WinSock"] }

[dev-dependencies]
criterion = "0.5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[[bench]]
name = "loopback_send_dump"
harness = false

[[bench]]
name = "scan_source"
harness = false

[[bench]]
name = "file_pipeline"
harness = false
required-features = ["bench-internals"]

[profile.release]
lto = "thin"
codegen-units = 1
